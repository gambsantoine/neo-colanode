# Colanode - production stack
#
#   cp .env.example .env   # then edit every value marked CHANGE_ME
#   docker compose up -d
#
# Images are built and published by .github/workflows/docker-publish.yml.

name: colanode

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD}', '--appendonly', 'yes']
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  server:
    image: ${COLANODE_REGISTRY:-ghcr.io/gambsantoine}/colanode-server:${COLANODE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CONFIG: /config.json
      # Values below are referenced from config.json through env:// pointers.
      SERVER_NAME: ${SERVER_NAME}
      WEB_DOMAIN: ${WEB_DOMAIN}
      CORS_ORIGIN: https://${WEB_DOMAIN}
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
    volumes:
      - ./config.json:/config.json:ro
      - server_storage:/var/lib/colanode/storage
    networks:
      - backend
      - frontend

  web:
    image: ${COLANODE_REGISTRY:-ghcr.io/gambsantoine}/colanode-web:${COLANODE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Server pre-registered in the web app on first load.
      COLANODE_SERVER_URL: https://${SERVER_DOMAIN}/config
    networks:
      - frontend

  # Reverse proxy with automatic HTTPS (Let's Encrypt).
  # WEB_DOMAIN and SERVER_DOMAIN must point (DNS A/AAAA) to this host.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
      - web
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      SERVER_DOMAIN: ${SERVER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

volumes:
  postgres_data:
  valkey_data:
  server_storage:
  caddy_data:
  caddy_config:

networks:
  backend:
  frontend:
